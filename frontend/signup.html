<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Birth Risk Predictor</title>
  <link rel="stylesheet" href="css/signup.css">
</head>
<body>
  <div class="animated-bg"></div>
  <div class="particles" id="particles"></div>

  <div class="logo">
    <a href="index.html">← Birth Risk Predictor</a>
  </div>

  <div class="container">
    <h2>Create Account</h2>
    <p class="subtitle">Join us to access personalized health assessments</p>

    <div class="features-list">
      <div class="feature-item">AI-Powered Analysis</div>
      <div class="feature-item">Secure & Private</div>
      <div class="feature-item">Instant Results</div>
      <div class="feature-item">Expert Guidance</div>
    </div>

    <form id="signupForm">
      <div class="input-group">
        <input type="email" id="email" placeholder="Email Address" required>
        <span class="input-icon">📧</span>
      </div>
      
      <div class="input-group">
        <input type="password" id="password" placeholder="Create Password" required minlength="8">
        <span class="input-icon">🔒</span>
        <div class="password-strength">
          <div class="password-strength-bar" id="strengthBar"></div>
        </div>
        <div class="password-hint" id="passwordHint">At least 8 characters</div>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="terms" required>
        <label for="terms">
          I agree to the <a href="#" onclick="return false;">Terms of Service</a> and <a href="#" onclick="return false;">Privacy Policy</a>
        </label>
      </div>

      <button type="submit">
        <span>Create Account</span>
        <div class="loading"></div>
      </button>
    </form>

    <div class="divider">
      <span>or sign up with</span>
    </div>

    <div class="social-login">
      <button class="social-btn" title="Sign up with Google">🔍</button>
      <button class="social-btn" title="Sign up with Facebook">👤</button>
      <button class="social-btn" title="Sign up with Apple">🍎</button>
    </div>

    <div class="links">
      <p>Already have an account? <a href="login.html">Login here</a></p>
    </div>
  </div>

  <script>
    // Create floating particles
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 50; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.animationDelay = Math.random() * 10 + 's';
      particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
      particlesContainer.appendChild(particle);
    }

    // Password strength checker
    const passwordInput = document.getElementById('password');
    const strengthBar = document.getElementById('strengthBar');
    const passwordHint = document.getElementById('passwordHint');

    passwordInput.addEventListener('input', function() {
      const password = this.value;
      let strength = 0;
      
      if (password.length >= 8) strength++;
      if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength++;
      if (password.match(/[0-9]/)) strength++;
      if (password.match(/[^a-zA-Z0-9]/)) strength++;

      strengthBar.className = 'password-strength-bar';
      
      if (strength === 1) {
        strengthBar.classList.add('weak');
        passwordHint.textContent = 'Weak password';
        passwordHint.style.color = '#ef4444';
      } else if (strength === 2 || strength === 3) {
        strengthBar.classList.add('medium');
        passwordHint.textContent = 'Medium strength';
        passwordHint.style.color = '#f59e0b';
      } else if (strength >= 4) {
        strengthBar.classList.add('strong');
        passwordHint.textContent = 'Strong password!';
        passwordHint.style.color = '#10b981';
      }
    });

    // Form submission
    document.getElementById("signupForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const terms = document.getElementById("terms").checked;
      const submitBtn = e.target.querySelector('button[type="submit"]');

      if (!terms) {
        alert("Please agree to the Terms of Service and Privacy Policy");
        return;
      }

      // Add loading state
      submitBtn.classList.add('loading');
      submitBtn.disabled = true;

      try {
        const res = await fetch("http://localhost:5000/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        // Remove loading state
        submitBtn.classList.remove('loading');
        submitBtn.disabled = false;

        if (res.ok) {
          // Success animation
          submitBtn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
          submitBtn.querySelector('span').textContent = '✓ Account Created!';
          
          alert(data.message);
          
          // Redirect after short delay
          setTimeout(() => {
            window.location.href = "login.html";
          }, 1500);
        } else {
          // Error shake animation
          submitBtn.style.animation = 'shake 0.5s';
          setTimeout(() => {
            submitBtn.style.animation = '';
          }, 500);
          alert(data.message || "Signup failed. Please try again.");
        }

      } catch (err) {
        console.error("Signup error:", err);
        submitBtn.classList.remove('loading');
        submitBtn.disabled = false;
        
        // Error shake animation
        submitBtn.style.animation = 'shake 0.5s';
        setTimeout(() => {
          submitBtn.style.animation = '';
        }, 500);
        
        alert("Something went wrong, please try again.");
      }
    });

    // Add shake animation
    const style = document.createElement('style');
    style.textContent = `
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-10px); }
        75% { transform: translateX(10px); }
      }
    `;
    document.head.appendChild(style);

    // Input focus animations
    const inputs = document.querySelectorAll('input[type="email"], input[type="password"]');
    inputs.forEach(input => {
      input.addEventListener('focus', function() {
        this.parentElement.style.transform = 'scale(1.02)';
      });
      
      input.addEventListener('blur', function() {
        this.parentElement.style.transform = 'scale(1)';
      });
    });

    // Social button interactions
    const socialBtns = document.querySelectorAll('.social-btn');
    socialBtns.forEach(btn => {
      btn.addEventListener('click', function() {
        alert('Social signup coming soon!');
      });
    });
  </script>
</body>
</html>
