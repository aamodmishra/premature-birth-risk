<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Birth Risk Predictor</title>
 <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="animated-bg"></div>
  <div class="particles" id="particles"></div>

  <div class="logo">
    <a href="index.html">← Birth Risk Predictor</a>
  </div>

  <div class="container">
    <h2>Welcome Back</h2>
    <p class="subtitle">Login to access your health assessment</p>

    <form id="loginForm">
      <div class="input-group">
        <input type="email" id="email" placeholder="Email Address" required>
        <span class="input-icon">📧</span>
      </div>
      
      <div class="input-group">
        <input type="password" id="password" placeholder="Password" required>
        <span class="input-icon">🔒</span>
      </div>

      <button type="submit">
        <span>Login</span>
        <div class="loading"></div>
      </button>
    </form>

    <div class="divider">
      <span>or continue with</span>
    </div>

    <div class="social-login">
      <button class="social-btn" title="Login with Google">🔍</button>
      <button class="social-btn" title="Login with Facebook">👤</button>
      <button class="social-btn" title="Login with Apple">🍎</button>
    </div>

    <div class="links">
      <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
      <p><a href="forgot.html">Forgot password?</a></p>
    </div>
  </div>

  <script>
    // Create floating particles
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 50; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.animationDelay = Math.random() * 10 + 's';
      particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
      particlesContainer.appendChild(particle);
    }

    // Form submission
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const submitBtn = e.target.querySelector('button[type="submit"]');

      // Add loading state
      submitBtn.classList.add('loading');
      submitBtn.disabled = true;

      try {
        const res = await fetch("http://localhost:5000/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        // Remove loading state
        submitBtn.classList.remove('loading');
        submitBtn.disabled = false;

        if (res.ok) {
          // Success animation
          submitBtn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
          submitBtn.querySelector('span').textContent = '✓ Success!';
          
          // Store email in localStorage
          localStorage.setItem("loggedInUser", email);
          
          // Redirect after short delay
          setTimeout(() => {
            window.location.href = "home.html";
          }, 1000);
        } else {
          // Error shake animation
          submitBtn.style.animation = 'shake 0.5s';
          setTimeout(() => {
            submitBtn.style.animation = '';
          }, 500);
          alert(data.message || "Login failed. Please try again.");
        }

      } catch (err) {
        console.error("Login error:", err);
        submitBtn.classList.remove('loading');
        submitBtn.disabled = false;
        
        // Error shake animation
        submitBtn.style.animation = 'shake 0.5s';
        setTimeout(() => {
          submitBtn.style.animation = '';
        }, 500);
        
        alert("Something went wrong. Please try again.");
      }
    });

    // Add shake animation
    const style = document.createElement('style');
    style.textContent = `
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-10px); }
        75% { transform: translateX(10px); }
      }
    `;
    document.head.appendChild(style);

    // Input focus animations
    const inputs = document.querySelectorAll('input');
    inputs.forEach(input => {
      input.addEventListener('focus', function() {
        this.parentElement.style.transform = 'scale(1.02)';
      });
      
      input.addEventListener('blur', function() {
        this.parentElement.style.transform = 'scale(1)';
      });
    });

    // Social button interactions
    const socialBtns = document.querySelectorAll('.social-btn');
    socialBtns.forEach(btn => {
      btn.addEventListener('click', function() {
        alert('Social login coming soon!');
      });
    });
  </script>
</body>
</html>
